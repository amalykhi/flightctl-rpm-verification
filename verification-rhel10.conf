#!/bin/bash
# FlightCtl OIDC Verification Configuration File
#
# This file contains all user-defined configuration parameters.
# Edit these values according to your environment.

# ============================================
# VM Configuration
# ============================================

# Libvirt VM name
VM_NAME="rhel10-fips-vm"


# VM SSH credentials
VM_USER="amalykhi"
VM_PASSWORD=" "  # Single space character

# VM Creation Parameters (used if VM doesn't exist)
# TODO:  Set CREATE_VM_IF_MISSING="true" to auto-create VM
CREATE_VM_IF_MISSING="false"

# VM specifications
VM_MEMORY="4096"           # Memory in MB
VM_CPUS="2"                # Number of vCPUs
VM_DISK_SIZE="20"          # Disk size in GB
VM_OS_VARIANT="rhel10.0"   # OS variant for virt-install

# VM installation source
# Options:
#   - URL: http://mirror.example.com/path/to/repo
#   - ISO: /path/to/iso/file.iso
#   - PXE: network boot
VM_INSTALL_SOURCE="https://dl.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/"

# Network configuration
VM_NETWORK="default"       # Libvirt network name

# Cloud-init configuration (optional)
# If provided, will use cloud-init for automated setup
VM_CLOUD_INIT_USER_DATA=""  # Path to cloud-init user-data file
VM_CLOUD_INIT_META_DATA=""  # Path to cloud-init meta-data file

# Kickstart file (optional)
# If provided, will use kickstart for automated installation
VM_KICKSTART_FILE="/home/amalykhi/RPMs and OIDC/rocky9-kickstart.cfg"       # Path to kickstart file or URL

# ============================================
# FlightCtl RPM Configuration
# ============================================

# RPM source URL or "LATEST" to auto-detect newest build
# Examples:
#   - "LATEST" (recommended - uses Copr builds page: https://copr.fedorainfracloud.org/coprs/g/redhat-et/flightctl-dev/builds/)
#   - Copr URL: "https://download.copr.fedorainfracloud.org/results/@redhat-et/flightctl-dev/epel-9-x86_64/09783358-flightctl/"
#   - Brew task URL: "https://brewweb.engineering.redhat.com/brew/taskinfo?taskID=69283299"
#   - Brew directory URL: "https://download-01.beak-001.prod.iad2.dc.redhat.com/brewroot/vol/rhel-9/packages/flightctl/0.10.0/1.el9em/x86_64/"
#   - Direct RPM URL: "https://download-01.beak-001.prod.iad2.dc.redhat.com/brewroot/vol/rhel-9/packages/flightctl/0.10.0/1.el9em/x86_64/flightctl-services-0.10.0-1.el9em.x86_64.rpm"
# FlightCtl 1.2.0-rc3 GitHub release RPMs
# Note: GitHub releases don't have directory listing, so we must use direct URLs
RPM_SOURCE="https://download-01.beak-001.prod.iad2.dc.redhat.com/brewroot/work/tasks/786/71740786/"

# Direct RPM URLs for 1.3.0 Brew build (task 71740786)
SERVICES_RPM_URL="https://download-01.beak-001.prod.iad2.dc.redhat.com/brewroot/work/tasks/786/71740786/flightctl-services-1.3.0-1.el10.x86_64.rpm"
CLI_RPM_URL="https://download-01.beak-001.prod.iad2.dc.redhat.com/brewroot/work/tasks/786/71740786/flightctl-cli-1.3.0-1.el10.x86_64.rpm"

# Copr repository configuration (for LATEST detection)
COPR_BUILDS_URL="https://copr.fedorainfracloud.org/coprs/g/redhat-et/flightctl-dev/builds/"
COPR_DOWNLOAD_BASE="https://download.copr.fedorainfracloud.org/results/@redhat-et/flightctl-dev/epel-9-x86_64"

# ============================================
# Authentication Type Configuration
# ============================================

# Authentication type to use
# Options:
#   - "both" (default): Test both PAM Issuer and Keycloak
#   - "pam": Use built-in PAM Issuer only (no external dependencies)
#   - "keycloak": Use external Keycloak OIDC provider only
#   - "none": Disable authentication
AUTH_TYPE="both"

# ============================================
# PAM Issuer Configuration (AUTH_TYPE=pam)
# ============================================

# PAM Issuer user credentials (will be created automatically)
PAM_USER="admin"
PAM_PASSWORD="admin123"

# PAM Issuer role for the user
# Options: flightctl-admin, flightctl-operator, flightctl-viewer, flightctl-installer
PAM_ROLE="flightctl-admin"

# Additional PAM users (optional)
# Format: "username:password:role"
# PAM_USERS=(
#     "operator1:pass1:flightctl-operator"
#     "viewer1:pass2:flightctl-viewer"
# )

# ============================================
# Keycloak Configuration (AUTH_TYPE=keycloak)
# ============================================

# Keycloak admin credentials
KEYCLOAK_ADMIN="admin"
KEYCLOAK_ADMIN_PASSWORD="admin"

# Keycloak ports
KEYCLOAK_PORT="8080"           # Main HTTP port
KEYCLOAK_HEALTH_PORT="9000"    # Health check port

# ============================================
# OIDC Configuration (AUTH_TYPE=keycloak)
# ============================================

# OIDC Realm name
OIDC_REALM="myrealm"

# OIDC Client ID
OIDC_CLIENT_ID="my_client"

# ============================================
# Test User Configuration (AUTH_TYPE=keycloak)
# ============================================

# Test user credentials for Keycloak OIDC authentication
# (Only used when AUTH_TYPE=keycloak)
TEST_USER="testuser"
TEST_PASSWORD="password"
TEST_EMAIL="testuser@example.com"

# Additional test users (optional)
# Format: "username:password:email"
# TEST_USERS=(
#     "user1:pass1:user1@example.com"
#     "user2:pass2:user2@example.com"
# )

# ============================================
# FIPS Configuration
# ============================================

# Enable FIPS mode on the VM
# Options:
#   - "false" (default): Don't modify FIPS settings
#   - "true": Enable FIPS mode (will reboot VM if needed)
#   - "verify": Only verify FIPS status, don't enable
ENABLE_FIPS="verify"

# Wait time after FIPS reboot (seconds)
FIPS_REBOOT_WAIT="120"

# ============================================
# Cleanup Options
# ============================================

# Full cleanup before test (ensures fresh state)
# Options:
#   - "true": Remove all FlightCtl data, containers, volumes, Keycloak
#   - "false" (default): Only reinstall RPMs, keep data
FULL_CLEANUP="true"

# ============================================
# Advanced Options
# ============================================

# Enable debug mode (set to "true" for verbose output)
DEBUG_MODE="false"

# Timeout for service startup (seconds)
SERVICE_START_TIMEOUT="15"

# Skip TLS verification (for testing only)
INSECURE_SKIP_TLS_VERIFY="true"

# Agent: skip TLS verification when connecting to the management server (for testing only).
# Set to "true" to avoid "tls: unknown certificate authority" on the agent.
AGENT_INSECURE_SKIP_TLS_VERIFY="true"

# Skip container image tag verification
# Set to "true" to skip checking if container images match the installed RPM version
SKIP_IMAGE_CHECK="true"

# ============================================
# Device Onboarding Configuration
# ============================================

# Enable device onboarding test
# Options:
#   - "true": Create agent VM, enroll device, verify enrollment
#   - "false" (default): Skip device onboarding
ENABLE_DEVICE_ONBOARDING="true"

# Agent VM name (will be created if doesn't exist)
# Use flightctl-agent-test-2 to onboard a second device (first remains flightctl-agent-test)
AGENT_VM_NAME="flightctl-agent-test-rhel10"

# Agent VM specifications
AGENT_VM_MEMORY="2048"        # Memory in MB
AGENT_VM_CPUS="2"             # Number of vCPUs
AGENT_VM_DISK_SIZE="20"       # Disk size in GB

# Agent VM SSH credentials (will be set during VM creation)
AGENT_VM_USER="agent"
AGENT_VM_PASSWORD="agent123"

# Optional: direct flightctl-agent RPM URL for onboarding.
# When set, this URL is used for the agent install (overrides Brew task list / directory discovery).
# Use an agent RPM whose OS (el9 vs el10) matches the agent VM image (e.g. el9 agent on bootc stream10).
AGENT_RPM_URL="https://download-01.beak-001.prod.iad2.dc.redhat.com/brewroot/work/tasks/786/71740786/flightctl-agent-1.3.0-1.el10.x86_64.rpm"

# Optional: direct flightctl-selinux RPM URL (same el major as agent). Overrides Brew/directory pairing.
AGENT_SELINUX_RPM_URL="https://download-01.beak-001.prod.iad2.dc.redhat.com/brewroot/work/tasks/786/71740786/flightctl-selinux-1.3.0-1.el10.noarch.rpm"

# Reset persisted agent identity/config before each onboarding attempt.
# Recommended "true" when management server is reinstalled between runs.
RESET_AGENT_STATE_BEFORE_ENROLLMENT="true"

# Agent VM base image
# Options:
#   - "bootc": Use CentOS bootc OSTree image (same as make agent-vm, has /sysroot)
#   - "centos9": Use CentOS Stream 9 cloud image
#   - "rocky9": Use Rocky Linux 9 cloud image (default)
#   - Custom URL: Direct URL to qcow2 image
AGENT_VM_IMAGE="bootc"

# Bootc image to use (only when AGENT_VM_IMAGE=bootc)
# stream10 aligns with el10 / flightctl-agent-*el10em* RPMs. stream10 matches el9 agent builds.
# After changing this, undefine the old agent domain or pick a new AGENT_VM_NAME so a fresh qcow2 is built.
BOOTC_IMAGE="quay.io/centos-bootc/centos-bootc:stream10"

# Optional: virt-install --os-variant for the bootc agent VM (default in script: fedora-eln).
# If libvirt errors on OS type, try: centos-stream10, rhel10.0, or fedora-eln
# BOOTC_VIRT_OS_VARIANT="centos-stream10"

# ============================================
# Local Registry Configuration
# ============================================

# Enable local registry for flightctl-device images
# Options:
#   - "true": Start local registry and push flightctl-device images
#   - "false" (default): Don't use local registry
ENABLE_LOCAL_REGISTRY="false"

# Local registry port
LOCAL_REGISTRY_PORT="5000"

# Local registry name (container name)
LOCAL_REGISTRY_NAME="flightctl-registry"

# FlightCtl device image tags to push to local registry
# These should match images available locally (check: podman images | grep flightctl-device)
FLIGHTCTL_DEVICE_TAGS="v6 v7 v8 v9 v10 v11 base"

# ============================================
# FlightCtl Repository Configuration
# ============================================

# Path to flightctl source repository (for using make targets)
# If set and valid, will use:
#   - make prepare-e2e-test (sets up registry, builds images)
#   - make push-e2e-agent-images (pushes images to registry)
#   - make agent-vm (creates properly configured agent VM)
# Leave empty to use the script's built-in bootc VM creation
FLIGHTCTL_REPO_PATH="/home/amalykhi/flightctl"

# Use flightctl repo's make agent-vm instead of script's bootc VM creation
# Options:
#   - "true": Use make agent-vm from FLIGHTCTL_REPO_PATH
#   - "false": Use script's built-in bootc VM creation
USE_MAKE_AGENT_VM="false"

# VM parameters for make agent-vm (only used if USE_MAKE_AGENT_VM=true)
# These map to: make agent-vm VMNAME=X VMCPUS=X VMDISKSIZE=X VMRAM=X
MAKE_AGENT_VM_CPUS="4"
MAKE_AGENT_VM_DISKSIZE="15G"
MAKE_AGENT_VM_RAM="2048"

# Enrollment approval mode
# Options:
#   - "auto": Automatically approve enrollment requests
#   - "manual": Wait for manual approval (timeout after 60s)
ENROLLMENT_APPROVAL_MODE="auto"

# Fleet name for device onboarding (optional)
# Empty = default fleet name "verification-fleet". The script creates this Fleet before enrollment;
# selector.matchLabels are built from DEVICE_LABELS. Approve uses the same labels so the device joins the fleet.
DEVICE_FLEET=""

# Labels to apply at enrollment approval (optional)
# Format: "key1=value1,key2=value2" — must match the verification fleet selector (same keys/values)
DEVICE_LABELS="env=test,managed-by=verification-script"

# After the device joins the verification fleet, wait for API summary status to leave "Unknown" (spec reconcile)
DEVICE_FLEET_STATUS_MAX_ATTEMPTS="36"
DEVICE_FLEET_STATUS_WAIT_INTERVAL="5"

